<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Lumina Robot - Light Mode Premium -->
  <defs>
    <!-- Head gradient -->
    <linearGradient id="headGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFF"/>
      <stop offset="100%" stop-color="#E8EEFF"/>
    </linearGradient>

    <!-- Screen gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Eye glow gradient -->
    <radialGradient id="eyeGlowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>

    <radialGradient id="eyeGlowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </radialGradient>

    <!-- Antenna glow -->
    <radialGradient id="antennaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.15"/>
    </filter>

    <!-- Soft glow for eyes -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Antenna pulse glow -->
    <filter id="pulseGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main head shape with shadow -->
  <g filter="url(#dropShadow)">
    <rect x="136" y="168" width="240" height="210" rx="48" fill="url(#headGradient)"/>
    <rect x="136" y="168" width="240" height="210" rx="48" fill="none" stroke="#818CF8" stroke-width="6"/>
  </g>

  <!-- Inner screen/visor -->
  <rect x="160" y="200" width="192" height="150" rx="24" fill="url(#screenGradient)"/>
  <rect x="160" y="200" width="192" height="150" rx="24" fill="none" stroke="#C7D2FE" stroke-width="2"/>

  <!-- Visor highlight reflection -->
  <rect x="172" y="212" width="80" height="16" rx="8" fill="#818CF8" opacity="0.15"/>

  <!-- Eyes with glow effect -->
  <g filter="url(#eyeGlow)">
    <!-- Left eye -->
    <rect x="192" y="248" width="40" height="64" rx="8" fill="url(#eyeGlowLeft)"/>
    <!-- Right eye -->
    <rect x="280" y="248" width="40" height="64" rx="8" fill="url(#eyeGlowRight)"/>
  </g>

  <!-- Eye highlights -->
  <rect x="198" y="254" width="12" height="20" rx="4" fill="white" opacity="0.5"/>
  <rect x="286" y="254" width="12" height="20" rx="4" fill="white" opacity="0.5"/>

  <!-- Connection ports -->
  <circle cx="112" cy="273" r="16" fill="#E0E7FF" stroke="#818CF8" stroke-width="3"/>
  <circle cx="112" cy="273" r="6" fill="#6366F1"/>
  <circle cx="400" cy="273" r="16" fill="#E0E7FF" stroke="#818CF8" stroke-width="3"/>
  <circle cx="400" cy="273" r="6" fill="#6366F1"/>

  <!-- Antenna array -->
  <g filter="url(#pulseGlow)">
    <!-- Left antenna -->
    <line x1="220" y1="168" x2="220" y2="120" stroke="#818CF8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="108" r="16" fill="url(#antennaGlow)"/>

    <!-- Right antenna (taller) -->
    <line x1="292" y1="168" x2="292" y2="96" stroke="#A78BFA" stroke-width="8" stroke-linecap="round"/>
    <circle cx="292" cy="84" r="18" fill="url(#antennaGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Antenna highlights -->
  <circle cx="220" cy="104" r="5" fill="white" opacity="0.6"/>
  <circle cx="292" cy="80" r="6" fill="white" opacity="0.6"/>
</svg>
