<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Lumina Robot Face - Layered 3D style -->

  <!-- Shadow/depth layer -->
  <ellipse cx="50" cy="85" rx="25" ry="4" fill="#000000" opacity="0.15"/>

  <!-- Robot head - main structure with depth -->
  <rect x="32" y="38" width="36" height="32" rx="8" fill="#2D3B8F" opacity="0.3"/>
  <rect x="30" y="35" width="40" height="35" rx="8" fill="#1E293B"/>
  <rect x="30" y="35" width="40" height="35" rx="8" fill="none" stroke="#6B8AFF" stroke-width="2.5"/>

  <!-- Inner screen/face panel with gradient effect -->
  <rect x="35" y="40" width="30" height="25" rx="4" fill="#0F172A"/>
  <rect x="35" y="40" width="30" height="25" rx="4" fill="url(#screenGlow)"/>

  <!-- Eyes - glowing AI indicators (asymmetric for personality) -->
  <rect x="40" y="48" width="6" height="10" rx="1" fill="#A78BFA">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="54" y="48" width="6" height="10" rx="1" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.7;1" dur="2.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Visor highlight -->
  <rect x="36" y="41" width="12" height="3" rx="1.5" fill="#6B8AFF" opacity="0.4"/>

  <!-- Connection ports (multiple AI providers) -->
  <circle cx="25" cy="52" r="3" fill="#4C5FD5" opacity="0.6"/>
  <circle cx="75" cy="52" r="3" fill="#4C5FD5" opacity="0.6"/>
  <circle cx="25" cy="52" r="1.5" fill="#818CF8"/>
  <circle cx="75" cy="52" r="1.5" fill="#818CF8"/>

  <!-- Antenna array (MCP connections) -->
  <line x1="45" y1="35" x2="45" y2="28" stroke="#6B8AFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="35" x2="55" y2="25" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="45" cy="26" r="2.5" fill="#A78BFA"/>
  <circle cx="55" cy="23" r="2.5" fill="#C084FC">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B8AFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0.05" />
    </linearGradient>
  </defs>
</svg>